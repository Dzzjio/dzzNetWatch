<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NetWatch — Scanning...</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 24px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #2a2d3e;
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .scan-label {
            color: #00ff88;
            font-size: 1.2rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .scan-sub {
            color: #555;
            font-size: 0.85rem;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 NetWatch</h1>
        </div>
        <div class="loader-wrap">
            <div class="spinner"></div>
            <div class="scan-label">Scanning network<span class="dots"></span></div>
            <div class="scan-sub">pinging hosts · checking ports · fingerprinting devices</div>
        </div>
    </div>

    <script>
        // poll every 2 seconds to check if scan is done
        function checkStatus() {
            fetch('/scan/status')
                .then(r => r.json())
                .then(data => {
                    // also stop if the server restarted mid-scan (running and done both false)
                    if (!data.running) {
                        // scan finished, go to dashboard
                        window.location.href = '/';
                    } else {
                        setTimeout(checkStatus, 2000);
                    }
                })
                .catch(() => setTimeout(checkStatus, 2000));
        }

        // start polling immediately
        checkStatus();
    </script>
</body>
</html>
