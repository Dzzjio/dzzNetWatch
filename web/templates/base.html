<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetWatch{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- icon sprite: <svg class="icon"><use href="#i-name"/></svg> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 12 19 5"/></symbol>
            <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2" width="11" height="20" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
            <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7.5c-1.6-1.2-4.4-1.1-5.8.7-1.7 2.1-1.2 5.9.6 8.9 1.1 1.9 2.4 3.4 3.7 3.4 1 0 1-.6 1.5-.6s.5.6 1.5.6c1.3 0 2.6-1.5 3.7-3.4 1.8-3 2.3-6.8.6-8.9-1.4-1.8-4.2-1.9-5.8-.7z"/><path d="M12 7.5c0-2 1.1-3.7 3-4.5"/></symbol>
            <symbol id="i-windows" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></symbol>
            <symbol id="i-linux" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></symbol>
            <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></symbol>
            <symbol id="i-router" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M17 13V9"/><path d="M14.2 6.2a4 4 0 0 1 5.6 0M12.1 4.1a7 7 0 0 1 9.8 0"/></symbol>
            <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="7" rx="1"/></symbol>
            <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
            <symbol id="i-unknown" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.2 9a3 3 0 0 1 5.8 1c0 2-3 2.8-3 4.5"/><path d="M12 18h.01"/></symbol>
            <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
            <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
            <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></symbol>
            <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
        </defs>
    </svg>

    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
        <a href="{{ url_for('dashboard') }}" class="brand">
            <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
            <span class="brand-name">Net<b>Watch</b></span>
        </a>
        <nav class="nav">
            {% set page = request.endpoint %}
            <a href="{{ url_for('dashboard') }}" class="{{ 'active' if page == 'dashboard' }}">
                <svg class="icon"><use href="#i-grid"/></svg><span>Devices</span>
            </a>
            <a href="{{ url_for('history') }}" class="{{ 'active' if page == 'history' }}">
                <svg class="icon"><use href="#i-clock"/></svg><span>History</span>
            </a>
            <a href="{{ url_for('api_devices') }}">
                <svg class="icon"><use href="#i-code"/></svg><span>API</span>
            </a>
        </nav>
        <a href="{{ url_for('trigger_scan') }}" class="btn btn-primary">
            <svg class="icon"><use href="#i-scan"/></svg><span>Scan</span>
        </a>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        NetWatch &middot; only scan networks you own or have permission to scan
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
